{% extends "base.html" %}

{% block content %}
<div class="card p-3">
  <h1 class="h4 mb-3">비밀번호 변경</h1>
  <form action="{% url 'accounts:change_password' %}" method="POST" class="row g-3">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="col-12">
      <button type="submit" class="btn btn-primary">비밀번호 변경</button>
      <a href="{% url 'accounts:update' %}" class="btn btn-outline-secondary ms-2">취소</a>
    </div>
  </form>
</div>
{% endblock content %}
